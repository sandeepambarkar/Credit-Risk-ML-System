<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit Risk Predictor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>Credit Risk Predictor</h1>
    <p>Predict whether a loan applicant is High Risk or Low Risk.</p>

    <form id="loanForm">
        <div class="grid">
            <input type="number" name="person_age" placeholder="Age" required>
            <input type="number" name="person_income" placeholder="Income" required>

            <select name="person_home_ownership">
                <option>RENT</option>
                <option>OWN</option>
                <option>MORTGAGE</option>
                <option>OTHER</option>
            </select>

            <input type="number" step="0.1" name="person_emp_length" placeholder="Employment Length">

            <select name="loan_intent">
                <option>PERSONAL</option>
                <option>EDUCATION</option>
                <option>MEDICAL</option>
                <option>VENTURE</option>
                <option>HOMEIMPROVEMENT</option>
                <option>DEBTCONSOLIDATION</option>
            </select>

            <select name="loan_grade">
                <option>A</option>
                <option>B</option>
                <option>C</option>
                <option>D</option>
                <option>E</option>
                <option>F</option>
                <option>G</option>
            </select>

            <input type="number" name="loan_amnt" placeholder="Loan Amount">
            <input type="number" step="0.1" name="loan_int_rate" placeholder="Interest Rate">

            <input type="number" step="0.01" name="loan_percent_income" placeholder="Loan Percent Income">

            <select name="cb_person_default_on_file">
                <option>N</option>
                <option>Y</option>
            </select>

            <input type="number" name="cb_person_cred_hist_length" placeholder="Credit History Length">
        </div>

        <button type="submit">Predict Risk</button>
    </form>

    <div id="result" class="hidden">
        <h2 id="risk"></h2>
        <p>Default Probability: <span id="prob"></span></p>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
